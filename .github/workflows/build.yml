name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build
        run: ./gradlew build -Pcommit="$GITHUB_SHA" -Pbuild_number="$GITHUB_RUN_NUMBER"
      - name: Prepare release artifact
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          jar="monocle-v$version-26.2.jar"
          test -s "build/libs/$jar"
          unzip -t "build/libs/$jar"
          test "$(unzip -p "build/libs/$jar" fabric.mod.json | jq -r .version)" = "$version"
          mkdir -p dist
          cp "build/libs/$jar" dist/
          host="monocle-host-$version.zip"
          test -s "host-service/build/distributions/$host"
          unzip -t "host-service/build/distributions/$host"
          cp "host-service/build/distributions/$host" dist/
          cd dist
          sha256sum "$jar" > "$jar.sha256"
          sha256sum "$host" > "$host.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: monocle-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: monocle-${{ github.run_number }}
          path: dist
      - name: Verify downloaded artifact
        working-directory: dist
        run: sha256sum --check *.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Monocle $GITHUB_REF_NAME" --generate-notes
